[project]
name = "ccmw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "rich>=13",
    "pyte>=0.8.2",
    "pillow>=10",
]

[project.scripts]
ccmw = "ccmw.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccmw"]
